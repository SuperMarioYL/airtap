# release.yml — feat-goreleaser-prebuilt-binary (MVP plan §5).
# On a `v*.*.*` tag push, goreleaser builds the airtap + airtapd static binaries
# (linux/darwin amd64/arm64) and attaches archives + checksums to the GitHub
# Release. goreleaser creates the release with its assets, so this workflow IS
# the uploader (publish_repo.sh skips upload when .goreleaser.yml exists).
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fix-attribution-leak-enforce-repo-topics: fail the release before any
      # binary is built if the repo metadata (topics / description / homepage)
      # carries a banned attribution string. `gh` is preinstalled on ubuntu
      # runners; GH_TOKEN lets it read repo metadata. Runs fail-closed.
      - name: Verify no attribution leaks in repo metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check_topics.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
