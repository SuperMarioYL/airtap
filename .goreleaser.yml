# .goreleaser.yml — feat-goreleaser-prebuilt-binary (MVP plan §5).
# Builds `airtap` (thin client) and `airtapd` (on-box daemon) as single static
# Go binaries for linux/darwin amd64/arm64, archives them as .tar.gz, and emits
# checksums.txt. The v0.1.0 release was source-only (`go install`); this cuts
# the install friction against the 信创/国企 IT-admin audience who may not run a
# Go toolchain on the thin-client laptop.
#
# Triggered by .github/workflows/release.yml on a `v*.*.*` tag push; goreleaser
# itself creates the GitHub Release with assets attached, so publish_repo.sh
# skips upload when this file exists.

version: 2

project_name: airtap

before:
  hooks:
    - go mod tidy

builds:
  - id: airtap
    main: ./cmd/airtap
    binary: airtap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: airtapd
    main: ./cmd/airtapd
    binary: airtapd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    builds:
      - airtap
      - airtapd

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
  name_template: '{{ .Tag }}'
