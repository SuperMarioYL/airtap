<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" data-palette="8de656-6ae77d-e3f6ac-dd667a06127f" role="img" aria-labelledby="demo-0-light-title demo-0-light-desc"><title id="demo-0-light-title">airtap demo 1</title><desc id="demo-0-light-desc">Offline manifest validation and allowlist membership; no daemon, model call, or network isolation is exercised.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="760" y2="330"><stop stop-color="#4f8030"/><stop offset=".6" stop-color="#3c8247"/><stop offset="1" stop-color="#6f7854"/></linearGradient><radialGradient id="halo"><stop stop-color="#4f8030" stop-opacity=".22"/><stop offset="1" stop-color="#fbfef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dcf7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#4f8030" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="760" height="330" rx="16" fill="#fbfef9"/><rect width="760" height="330" rx="16" fill="url(#grid)"/><ellipse cx="478.8" cy="141.9" rx="380.0" ry="230.99999999999997" fill="url(#halo)"/><text x="36" y="44" fill="#607a6b" font-size="13" text-anchor="start" font-weight="400">DEMO / STEP 01</text><text