<svg xmlns="http://www.w3.org/2000/svg" width="400" height="685" viewBox="0 0 400 685" data-palette="8de656-6ae77d-e3f6ac-dd667a06127f" role="img" aria-labelledby="process-mobile-light-title process-mobile-light-desc"><title id="process-mobile-light-title">airtap process</title><desc id="process-mobile-light-desc">The local model address is allowed; example.com:443 is not.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="685"><stop stop-color="#4f8030"/><stop offset=".6" stop-color="#3c8247"/><stop offset="1" stop-color="#6f7854"/></linearGradient><radialGradient id="halo"><stop stop-color="#4f8030" stop-opacity=".22"/><stop offset="1" stop-color="#fbfef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dcf7cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#4f8030" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="685" rx="16" fill="#fbfef9"/><rect width="400" height="685" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="294.55" rx="200.0" ry="479.49999999999994" fill="url(#halo)"/><text x="28" y="44" fill="#607a6b" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#1b2a1c" font-size="25" text-anchor="start" font-weight="400">From input to a useful</text><text x="28" y="119.0" fill="#1b2a1c" font-size="25" text-anchor="start" font-weight="400">result</text><path d="M200 257V290" fill="none" stroke="#4f8030" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#6f7854" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#f9fef7" stroke="#dcf7cb"/><text x="46" y="166.0" fill="#1b2a1c" font-size="21" text-anchor="start" font-weight="400">01  Load manifest</text><text x="46" y="218.0" fill="#607a6b" font-size="17" text-anchor="start" font-weight="400">examples/airtap.yaml</text><path d="M200 412V445" fill="none" stroke="#4f8030" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#6f7854" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#f9fef7" stroke="#dcf7cb"/><text x="46" y="321.0" fill="#1b2a1c" font-size="21" text-anchor="start" font-weight="400">02  Validate fields</text><text x="46" y="373.0" fill="#607a6b" font-size="17" text-anchor="start" font-weight="400">Model and tools accepted</text><rect x="28" y="445" width="344" height="122" rx="12" fill="#f9fef7" stroke="#dcf7cb"/><text x="46" y="476.0" fill="#1b2a1c" font-size="21" text-anchor="start" font-weight="400">03  Check destinations</text><text x="46" y="528.0" fill="#607a6b" font-size="17" text-anchor="start" font-weight="400">One allowed, one denied</text><text x="28" y="620.0" fill="#6f7854" font-size="18" text-anchor="start" font-weight="400">The local model address is</text><text x="28" y="645.2" fill="#6f7854" font-size="18" text-anchor="start" font-weight="400">allowed; example.com:443 is not.</text></svg>
